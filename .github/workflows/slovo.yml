name: Новое слово
on:
  issues:
    types: [opened, edited, labeled]
permissions:
  contents: write
  issues: write
jobs:
  slovo:
    if: contains(github.event.issue.labels.*.name, 'слово')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Разобрать заявку и сверить с Викисловарём
        id: z
        env:
          BODY: ${{ github.event.issue.body }}
        run: python3 scripts/zayavka.py
      - name: Ответить в заявке
        if: github.event.action != 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file otvet.md
      - name: Добавить слово, если владелец поставил метку «принято»
        if: github.event.action == 'labeled' && github.event.label.name == 'принято' && github.event.sender.login == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          python3 scripts/zayavka.py --add "#$NUM"
          python3 scripts/check.py
          git config user.name "udareniya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Слово из заявки #$NUM"
          git push
          gh issue close "$NUM" --comment "Добавлено в словарь. Спасибо!"
